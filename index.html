<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferme</title>
<meta name="theme-color" content="#F5F3EC">
<style>
  :root { --fond:#F5F3EC; --carte:#fff; --texte:#2b2a26; --doux:#6b6860; --bord:#ddd8cc; }
  @media (prefers-color-scheme: dark) { :root { --fond:#1d1c19; --carte:#2a2925; --texte:#eeeae0; --doux:#a8a397; --bord:#3d3b35; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fond); color:var(--texte); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.6rem; margin:0 0 24px; }
  .tuiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  a.tuile { display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px 12px; background:var(--carte);
            border:1px solid var(--bord); border-radius:14px; color:inherit; text-decoration:none; text-align:center; }
  a.tuile img { width:72px; height:72px; border-radius:16px; }
  a.tuile b { font-size:1.05rem; }
  a.tuile span { color:var(--doux); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Ferme</h1>
  <div class="tuiles">
    <a class="tuile" href="paturage/"><img src="paturage/icon-192.png" alt=""><b>Pâturage</b><span>Troupeaux et paddocks</span></a>
    <a class="tuile" href="eau/"><img src="eau/icon-192.png" alt=""><b>Eau</b><span>Mares, ruisseaux, pluie</span></a>
  </div>
</main>
</body>
</html>
